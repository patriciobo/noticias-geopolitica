# Investigación de feeds RSS/Atom públicos para cada `id` de sources.yaml.
# Mismo orden y mismos ids que sources.yaml. Verificado con WebFetch/curl (rigor rápido, no exhaustivo).
# NO_RSS = no se encontró feed público funcional; se anota alternativa liviana si existe
# (sitemap, wp-json, RSS de feedburner de terceros, cuenta de X/Twitter). No se sugiere
# scraping agresivo ni bypass de paywall/anti-bot: eso queda para scraping puntual respetuoso
# de robots.txt más adelante.
# Para medios en chino/japonés/coreano se priorizó, cuando existe, el feed de la edición en
# inglés (se indica en comentario); si no hay edición en inglés se usó el feed nativo (idioma anotado).

# --- Canadá ---
toronto-star: "https://www.thestar.com/search/?q=&f=rss&t=article&l=50&s=start_time&sd=desc"
national-observer: "https://www.nationalobserver.com/front/rss"
national-post: "https://nationalpost.com/feed/"
toronto-sun: "https://torontosun.com/feed/"
rebel-news: "http://www.rebelnews.com/news.rss"

# --- Estados Unidos ---
fox-news: "https://moxie.foxnews.com/google-publisher/latest.xml"
breitbart-news: "http://feeds.feedburner.com/breitbart"
nyt: "https://rss.nytimes.com/services/xml/rss/nyt/HomePage.xml"
washington-post: "https://feeds.washingtonpost.com/rss/national"  # WaPo discontinuó el feed general de homepage (~2023); esta sección "national" es el equivalente activo más cercano
cnn: "NO_RSS"  # feeds legacy de rss.cnn.com/edition.cnn.com responden XML válido pero están congelados (sin items nuevos desde 2023-2024), no sirven para polling diario; sin alternativa liviana confirmada

