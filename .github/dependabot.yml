# Actualizaciones automáticas de dependencias (y de las actions fijadas por
# SHA en .github/workflows). Agrupadas y semanales para no llenar el repo
# de PRs; las de seguridad llegan igual apenas se publican.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /core
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    # typescript-eslint (vía eslint-config-next) todavía no soporta
    # TypeScript 7 ni ESLint 10: con esas versiones `npm run lint` falla
    # antes de revisar nada (PR #2, 2026-09-24). Sacar estos ignore cuando
    # typescript-eslint publique soporte.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
