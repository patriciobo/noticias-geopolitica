name: CodeQL

# Análisis estático de seguridad del backend Go y del blog Next.js. Los
# hallazgos aparecen en Security → Code scanning.

on:
  push:
    branches: [main]
    paths-ignore: ["reports/**"]
  pull_request:
    paths-ignore: ["reports/**"]
  schedule:
    - cron: "27 4 * * 1" # semanal, para agarrar reglas nuevas aunque no haya cambios

permissions: {}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - if: matrix.language == 'go'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - uses: github/codeql-action/init@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - if: matrix.language == 'go'
        working-directory: core
        run: go build ./...

      - uses: github/codeql-action/analyze@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3.38.1
        with:
          category: /language:${{ matrix.language }}
