name: Informe diario

on:
  schedule:
    - cron: "13 10 * * *" # ~10:13 UTC = ~07:13 Argentina — evita el tope de hora, donde GitHub retrasa o saltea crons por carga
  workflow_dispatch: # botón "Run workflow" para probar a mano

permissions:
  contents: write # para commitear el reporte generado

concurrency:
  group: daily-report
  # true: un dispatch nuevo cancela corridas viejas encoladas en vez de
  # amontonarse — evita que una corrida vieja ejecute contra un commit
  # desactualizado y choque el push contra main.
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Generar reporte
        working-directory: core
        env:
          LLM_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SOURCES_PATH: ../config/sources.yaml
          GAZETTEER_PATH: ../config/gazetteer.yaml
          OUT_DIR: ../reports
        run: go run ./cmd/ingest

      - name: Commitear reporte
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear"
            exit 0
          fi
          git commit -m "chore: informe del $(date -u +%F)"

          # El push puede chocar con un push manual hecho al mismo tiempo
          # (main se movió desde el checkout). Reintenta con rebase en vez
          # de perder el reporte generado.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rechazado (intento $i), reintentando tras rebase..."
            git fetch origin main
            git rebase origin/main
            sleep $((i * 5))
          done
          echo "no se pudo pushear el reporte tras varios intentos" >&2
          exit 1
