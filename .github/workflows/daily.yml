name: Informe diario

on:
  # El cron de GitHub es "best effort": en la práctica llegó con horas de
  # atraso o directamente no disparó (22/09 nada, 23/09 recién 14:57 UTC).
  # Por eso hay un intento cada 20 minutos; el job `check` hace que solo
  # el primero que llegue genere el informe y el resto se saltee.
  schedule:
    # 08:07 a 10:47 UTC cada 20 min = 05:07 a 07:47 Argentina (9 intentos,
    # el último antes de las 08:00). Minutos fuera del :00 para esquivar
    # el pico de carga de GitHub.
    - cron: "7,27,47 8-10 * * *"
  # Botón "Run workflow" (siempre genera) y disparo externo desde
  # cron-job.org (ver DEPLOY.md), que sí respeta la hora y manda
  # solo_si_falta=true para comportarse como un cron más.
  workflow_dispatch:
    inputs:
      solo_si_falta:
        description: "Saltear si el informe de hoy ya existe (lo usa el disparo externo)"
        type: boolean
        default: false
      motivo:
        description: "Motivo de la regeneración (se publica en la edición si ya existía una versión de hoy)"
        type: string
        default: ""
      enviar_newsletter:
        description: "Mandar el newsletter (desmarcar al regenerar un informe que ya se envió)"
        type: boolean
        default: true

# Por defecto sin permisos; el job pide solo los que usa.
permissions: {}

concurrency:
  group: daily-report
  # Un dispatch manual cancela corridas viejas encoladas en vez de
  # amontonarse — evita que una corrida vieja ejecute contra un commit
  # desactualizado y choque el push contra main. Un cron (de GitHub o
  # externo con solo_si_falta), en cambio, no cancela: si otra corrida
  # está generando, espera y después `check` lo saltea.
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && !inputs.solo_si_falta }}

jobs:
  # Saltea los crons (y el disparo externo) si el informe del día ya está en main.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.exists.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: reports

      - id: exists
        env:
          SOLO_SI_FALTA: ${{ inputs.solo_si_falta }}
        run: |
          f="reports/$(date -u +%F).md"
          if { [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ "$SOLO_SI_FALTA" = "true" ]; } && [ -f "$f" ]; then
            echo "$f ya existe, salteo esta corrida de respaldo"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  ingest:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # para commitear el reporte generado
      id-token: write # para firmar la atestación con Sigstore (OIDC de GitHub)
      attestations: write # para publicar la atestación en el repo
    steps:
      # Actions fijadas por SHA de commit (no por tag, que se puede mover):
      # un tag comprometido no puede cambiar el código que corre acá con
      # acceso a los secrets. Dependabot las mantiene actualizadas.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Generar reporte
        id: ingest
        working-directory: core
        env:
          LLM_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Fallback si Gemini falla (cuota agotada, caída): cae a un
          # modelo free de OpenRouter en vez de perder la corrida del
          # día. Opcional — sin el secret, el pipeline sigue andando
          # solo con Gemini como antes.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Modelo pago barato por delante de Gemini: el free tier de Gemini
          # devuelve 503 por demanda seguido (2026-09-24). DeepSeek V4 Flash
          # cuesta ~USD 0,60/mes con el volumen actual, pagado con créditos
          # de OpenRouter. Si se quedan sin saldo, falla con 402 y la cadena
          # sigue con Gemini y los modelos free.
          # Clasificación: Qwen (free) primero y DeepSeek de respaldo. Con las
          # etiquetas verificadas por tres jueces (eval/resultados-2026-09-25.md)
          # Qwen tiene F1 0.92 y DeepSeek 0.86: Qwen es más preciso (95% contra
          # 77%) pero falla seguido por ser gratis (16 de 115 sin respuesta);
          # lo que falla lo cubre DeepSeek. La redacción sigue con DeepSeek.
          # Volver a evaluar antes de cambiar.
          OPENROUTER_PRIMARY_CLASSIFY_MODELS: qwen/qwen3.8-27b:free,deepseek/deepseek-v4-flash
          OPENROUTER_CLASSIFY_MODELS: nvidia/nemotron-3-super-120b-a12b:free,google/gemma-4-31b-it:free
          OPENROUTER_PRIMARY_SYNTHESIZE_MODELS: deepseek/deepseek-v4-flash
          SOURCES_PATH: ../config/sources.yaml
          GAZETTEER_PATH: ../config/gazetteer.yaml
          OUT_DIR: ../reports
          REGENERATION_REASON: ${{ inputs.motivo }}
        run: |
          go run ./cmd/ingest
          # Mismo cómputo de fecha que usa cmd/ingest para nombrar el
          # archivo (time.Now() en UTC, igual que el runner) — se lo pasa
          # al paso de newsletter para que no tenga que recalcularlo y
          # arriesgarse a desalinearse si corre cerca de medianoche.
          echo "report_date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # Prueba pública de origen: firma (Sigstore) el hash de cada archivo
      # de la edición, atado a este workflow y a este commit. Cualquiera
      # puede verificar que el archivo publicado es exactamente el que
      # generó el pipeline, sin ediciones a mano posteriores:
      #   gh attestation verify reports/AAAA-MM-DD.md -R <dueño>/<repo>
      - name: Firmar la edición (atestación de origen)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            reports/${{ steps.ingest.outputs.report_date }}.md
            reports/${{ steps.ingest.outputs.report_date }}.sources.json
            reports/${{ steps.ingest.outputs.report_date }}.audit.json

      - name: Commitear reporte
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: informe del $(date -u +%F)"

          # El push puede chocar con un push manual hecho al mismo tiempo
          # (main se movió desde el checkout). Reintenta con rebase en vez
          # de perder el reporte generado.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "committed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push rechazado (intento $i), reintentando tras rebase..."
            git fetch origin main
            git rebase origin/main
            sleep $((i * 5))
          done
          echo "no se pudo pushear el reporte tras varios intentos" >&2
          exit 1

      # Newsletter opcional: manda por email el Resumen ejecutivo + Resumen
      # por región del día a los suscriptores activos (alta solo con email,
      # vía el form del blog). Sin DATABASE_URL o BREVO_API_KEY configurados
      # este paso no hace nada (no rompe el resto del pipeline) — mismo
      # patrón defensivo que el step de Render de más abajo.
      - name: Enviar newsletter
        # En un cron no hay inputs: se manda siempre. Ojo, no usar
        # `inputs.enviar_newsletter != false`: null y false se comparan
        # como iguales en las expresiones de Actions.
        if: steps.commit.outputs.committed == 'true' && (github.event_name != 'workflow_dispatch' || inputs.enviar_newsletter)
        working-directory: core
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          OUT_DIR: ../reports
          REPORT_DATE: ${{ steps.ingest.outputs.report_date }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: go run ./cmd/newsletter

      # Dispara el deploy en Render directo por su Deploy Hook, en vez de
      # depender del webhook de GitHub→Render (auto-deploy "On Commit"):
      # ese webhook dejó de avisarle a Render en algún momento sin ningún
      # error visible acá, y el reporte nuevo quedó pusheado pero invisible
      # en producción varios días. Esto es causal — el mismo job que generó
      # el reporte dispara su propio deploy, no depende de una integración
      # de terceros que se puede romper en silencio.
      #
      # Opcional: sin el secret configurado, este paso no hace nada (no
      # rompe el resto del pipeline).
      - name: Disparar deploy en Render
        if: steps.commit.outputs.committed == 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL no configurado, salteo (queda a cargo del auto-deploy de Render)"
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "deploy disparado en Render"
