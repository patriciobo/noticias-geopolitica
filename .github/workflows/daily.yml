name: Informe diario

on:
  schedule:
    - cron: "13 10 * * *" # ~10:13 UTC = ~07:13 Argentina — evita el tope de hora, donde GitHub retrasa o saltea crons por carga
  workflow_dispatch: # botón "Run workflow" para probar a mano

# Por defecto sin permisos; el job pide solo los que usa.
permissions: {}

concurrency:
  group: daily-report
  # true: un dispatch nuevo cancela corridas viejas encoladas en vez de
  # amontonarse — evita que una corrida vieja ejecute contra un commit
  # desactualizado y choque el push contra main.
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # para commitear el reporte generado
      id-token: write # para firmar la atestación con Sigstore (OIDC de GitHub)
      attestations: write # para publicar la atestación en el repo
    steps:
      # Actions fijadas por SHA de commit (no por tag, que se puede mover):
      # un tag comprometido no puede cambiar el código que corre acá con
      # acceso a los secrets. Dependabot las mantiene actualizadas.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Generar reporte
        id: ingest
        working-directory: core
        env:
          LLM_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Fallback si Gemini falla (cuota agotada, caída): cae a un
          # modelo free de OpenRouter en vez de perder la corrida del
          # día. Opcional — sin el secret, el pipeline sigue andando
          # solo con Gemini como antes.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SOURCES_PATH: ../config/sources.yaml
          GAZETTEER_PATH: ../config/gazetteer.yaml
          OUT_DIR: ../reports
        run: |
          go run ./cmd/ingest
          # Mismo cómputo de fecha que usa cmd/ingest para nombrar el
          # archivo (time.Now() en UTC, igual que el runner) — se lo pasa
          # al paso de newsletter para que no tenga que recalcularlo y
          # arriesgarse a desalinearse si corre cerca de medianoche.
          echo "report_date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # Prueba pública de origen: firma (Sigstore) el hash de cada archivo
      # de la edición, atado a este workflow y a este commit. Cualquiera
      # puede verificar que el archivo publicado es exactamente el que
      # generó el pipeline, sin ediciones a mano posteriores:
      #   gh attestation verify reports/AAAA-MM-DD.md -R <dueño>/<repo>
      - name: Firmar la edición (atestación de origen)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            reports/${{ steps.ingest.outputs.report_date }}.md
            reports/${{ steps.ingest.outputs.report_date }}.sources.json
            reports/${{ steps.ingest.outputs.report_date }}.audit.json

      - name: Commitear reporte
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: informe del $(date -u +%F)"

          # El push puede chocar con un push manual hecho al mismo tiempo
          # (main se movió desde el checkout). Reintenta con rebase en vez
          # de perder el reporte generado.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "committed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push rechazado (intento $i), reintentando tras rebase..."
            git fetch origin main
            git rebase origin/main
            sleep $((i * 5))
          done
          echo "no se pudo pushear el reporte tras varios intentos" >&2
          exit 1

      # Newsletter opcional: manda por email el Resumen ejecutivo + Resumen
      # por región del día a los suscriptores activos (alta solo con email,
      # vía el form del blog). Sin DATABASE_URL o BREVO_API_KEY configurados
      # este paso no hace nada (no rompe el resto del pipeline) — mismo
      # patrón defensivo que el step de Render de más abajo.
      - name: Enviar newsletter
        if: steps.commit.outputs.committed == 'true'
        working-directory: core
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          OUT_DIR: ../reports
          REPORT_DATE: ${{ steps.ingest.outputs.report_date }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: go run ./cmd/newsletter

      # Dispara el deploy en Render directo por su Deploy Hook, en vez de
      # depender del webhook de GitHub→Render (auto-deploy "On Commit"):
      # ese webhook dejó de avisarle a Render en algún momento sin ningún
      # error visible acá, y el reporte nuevo quedó pusheado pero invisible
      # en producción varios días. Esto es causal — el mismo job que generó
      # el reporte dispara su propio deploy, no depende de una integración
      # de terceros que se puede romper en silencio.
      #
      # Opcional: sin el secret configurado, este paso no hace nada (no
      # rompe el resto del pipeline).
      - name: Disparar deploy en Render
        if: steps.commit.outputs.committed == 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL no configurado, salteo (queda a cargo del auto-deploy de Render)"
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "deploy disparado en Render"
